<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta | Ella Li</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
</head>
<body>
    <h1>Meta</h1>
    <p>This page includes stats about the code of this website.</p>

    <div id="stats"></div>

    <h2>Commits by time of day</h2>
    <div id="scrolly-1">
        <!-- left column: explanatory text that the reader scrolls through -->
        <div id="scatter-story"></div> <!-- one .step per commit, added by main.js -->

        <!-- right column: stays in view (sticky) while the story scrolls -->
        <div id="scatter-plot">
            <div id="chart"></div>

            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <h2>Files by size</h2>
    <!-- mirrored layout: visualization on the left, story on the right -->
    <div id="scrolly-2">
        <!-- file sizes unit visualization, filled in by updateFileDisplay() in main.js -->
        <div id="files-plot">
            <dl id="files"></dl>
        </div>

        <div id="files-story"></div> <!-- one .step per commit, added by main.js -->
    </div>

    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd>
            <a href="" id="commit-link" target="_blank"></a>
        </dd>

        <dt>Date</dt>
        <dd id="commit-date"></dd>

        <dt>Time</dt>
        <dd id="commit-hour"></dd>

        <dt>Author</dt>
        <dd id="commit-author"></dd>

        <dt>Lines edited</dt>
        <dd id="commit-lines"></dd>
    </dl>
</body>
</html>
